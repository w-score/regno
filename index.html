<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競技者登録番号検索</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f7f5f1;
  --surface:#ffffff;
  --ink:#232120;
  --ink-2:#6b6560;
  --line:#e2ddd5;
  --accent:#d9541e;
  --accent-ink:#ffffff;
  --mark:#ffe4b8;
  --row-hover:#fbf3ea;
  --focus:#d9541e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1b1917;--surface:#242120;--ink:#ece7e0;--ink-2:#a39b92;--line:#3a3532;
    --accent:#f07a44;--accent-ink:#1b1917;--mark:#5a3a1a;--row-hover:#2d2825;--focus:#f07a44;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b1917;--surface:#242120;--ink:#ece7e0;--ink-2:#a39b92;--line:#3a3532;
  --accent:#f07a44;--accent-ink:#1b1917;--mark:#5a3a1a;--row-hover:#2d2825;--focus:#f07a44;
}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:20px}
h1{font-size:1.35rem;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--ink-2);font-size:.85rem;margin:0}
.search{position:relative}
.search input{
  width:100%;box-sizing:border-box;font:inherit;font-size:1.15rem;padding:12px 44px 12px 14px;
  border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);
}
.search input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.search button{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--ink-2);font-size:1.3rem;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer
}
.search button:hover{background:var(--row-hover)}
.search button:focus-visible{outline:2px solid var(--focus)}
.hint{color:var(--ink-2);font-size:.82rem;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 16px}
.status{margin:20px 0 8px;font-size:.9rem;color:var(--ink-2);min-height:1.5em}
.status strong{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.78rem;font-weight:500;color:var(--ink-2);letter-spacing:.06em;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--row-hover)}
td.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
td.name{font-weight:500}
td.dim{color:var(--ink-2);font-size:.88rem}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.copy{
  font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:4px;padding:2px 8px;cursor:pointer;margin-left:8px;vertical-align:middle
}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy:focus-visible{outline:2px solid var(--focus)}
.copy.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2)}
.more{padding:10px 12px;font-size:.85rem;color:var(--ink-2);border-top:1px solid var(--line);background:var(--bg)}
.rest{margin-top:24px;font-size:.85rem;color:var(--ink-2)}
.rest dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.rest dt{font-weight:500}
.rest dd{margin:0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--focus)}
.chip b{color:var(--ink-2);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
@media (max-width:600px){
  body{font-size:14px}
  .search input{font-size:1.05rem}
  th,td{padding:7px 8px}
}
@media (prefers-reduced-motion:no-preference){.copy{transition:background .15s,color .15s}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>競技者登録番号検索</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <form class="search" id="form" autocomplete="off">
    <input type="search" id="q" placeholder="氏名の一部（姓・名どちらでも）または番号" aria-label="検索" enterkeyhint="search">
    <button type="button" id="clear" aria-label="クリア" title="クリア" hidden>×</button>
  </form>
  <p class="hint">
    <span>姓と名の間の空白は無視して照合します（「奥田健」でも「奥田 健史」に当たります）</span>
    <span>空白区切りで複数語（例：「田中 東京都」）は AND 検索</span>
  </p>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="tablewrap" id="tablewrap" hidden>
    <table>
      <thead><tr>
        <th>番号</th><th>氏名</th><th>登録都道府県</th><th>ふるさと</th><th>登録日</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="more" id="more" hidden></div>
  </div>

  <div class="rest" id="rest">
    <div>登録都道府県別の件数（押すとその都道府県で絞り込み）</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

const ROWS = RAW.split("\n").map(l => {
  const c = l.split("\t");
  return { num: c[0], name: c[1], pref: c[2], home: c[3], date: c[4], act: c[5],
           key: norm(c[1]), knum: c[0].replace(/-/g, "") };
});
const LIMIT = 300;

function norm(s){
  return s.normalize("NFKC").replace(/[\s　]+/g, "").toLowerCase();
}
function esc(s){ return s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }

// 空白を無視した名前に対して、元の表記（空白入り）上でハイライト
function hilite(name, terms){
  const chars = [...name];
  const map = []; let k = "";
  chars.forEach((ch, i) => { const n = norm(ch); for (const _ of n){ map.push(i); } k += n; });
  const hit = new Array(chars.length).fill(false);
  for (const t of terms){
    if (!t) continue;
    let p = k.indexOf(t);
    while (p >= 0){ for (let j = p; j < p + t.length; j++) hit[map[j]] = true; p = k.indexOf(t, p + 1); }
  }
  let out = "", open = false;
  chars.forEach((ch, i) => {
    if (hit[i] && !open){ out += "<mark>"; open = true; }
    if (!hit[i] && open){ out += "</mark>"; open = false; }
    out += esc(ch);
  });
  if (open) out += "</mark>";
  return out;
}

const $ = id => document.getElementById(id);
const q = $("q"), tbody = $("tbody"), status = $("status"), wrap = $("tablewrap"),
      more = $("more"), rest = $("rest"), clearBtn = $("clear");

const dates = ROWS.map(r => r.date).sort();
$("subtitle").textContent = `${ROWS.length.toLocaleString()} 件・有効化日 ${ROWS[0].act}・登録日 ${dates[0]}〜${dates[dates.length-1]} のリストから`;

function search(){
  const raw = q.value.trim();
  clearBtn.hidden = !raw;
  if (!raw){
    wrap.hidden = true; rest.hidden = false; status.textContent = ""; return;
  }
  const terms = norm(raw).split(/[\s　]+/).filter(Boolean);
  // 入力全体を空白なしで連結したものでもヒットさせる（「奥田 健」→「奥田健」）
  const joined = terms.join("");
  const res = ROWS.filter(r => {
    if (r.key.includes(joined) || r.knum.includes(joined.replace(/-/g,""))) return true;
    return terms.every(t => r.key.includes(t) || r.num.includes(t) || r.knum.includes(t.replace(/-/g,""))
                        || norm(r.pref).includes(t) || norm(r.home).includes(t));
  });
  const nameTerms = [joined, ...terms];
  rest.hidden = true; wrap.hidden = false;
  status.innerHTML = res.length ? `<strong>${res.length.toLocaleString()}</strong> 件` : "該当なし";
  const shown = res.slice(0, LIMIT);
  tbody.innerHTML = shown.map(r => `<tr>
    <td class="num">${esc(r.num)}<button class="copy" type="button" data-num="${esc(r.num)}" title="番号をコピー">コピー</button></td>
    <td class="name">${hilite(r.name, nameTerms)}</td>
    <td class="dim">${esc(r.pref)}</td>
    <td class="dim">${esc(r.home)}</td>
    <td class="dim">${esc(r.date)}</td>
  </tr>`).join("");
  if (!res.length) tbody.innerHTML = `<tr><td colspan="5" class="empty">「${esc(raw)}」に一致する登録者はいません。姓だけ、名だけで試してください。</td></tr>`;
  more.hidden = res.length <= LIMIT;
  more.textContent = res.length > LIMIT ? `先頭 ${LIMIT} 件のみ表示しています。語を追加して絞り込んでください。` : "";
}

q.addEventListener("input", search);
$("form").addEventListener("submit", e => { e.preventDefault(); search(); });
clearBtn.addEventListener("click", () => { q.value = ""; search(); q.focus(); });

tbody.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const num = b.dataset.num;
  const done = () => { b.textContent = "コピー済"; b.classList.add("done");
    setTimeout(() => { b.textContent = "コピー"; b.classList.remove("done"); }, 1500); };
  const fallback = () => {
    const range = document.createRange(); range.selectNodeContents(b.parentElement.firstChild);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(num).then(done, fallback);
  } else fallback();
});

// 都道府県チップ
const counts = new Map();
ROWS.forEach(r => counts.set(r.pref, (counts.get(r.pref) || 0) + 1));
$("chips").innerHTML = [...counts.entries()].sort((a,b) => b[1]-a[1])
  .map(([p,n]) => `<button type="button" class="chip" data-p="${esc(p)}">${esc(p)}<b>${n}</b></button>`).join("");
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  q.value = c.dataset.p; search(); q.focus();
});

q.focus();
